name: Publish web

on:
  push:
    branches:
      - '**'
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One site, so the newest push wins rather than queueing behind an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: setup
        uses: actions/configure-pages@v5
        with:
          # Enables Pages when the token is allowed to. Creating the site for
          # the very first time needs admin rights, which this token does not
          # have, so that one step is done by hand — see below.
          enablement: true

      - name: How to switch Pages on
        if: failure() && steps.setup.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages がまだ有効ではありません。" \
            "リポジトリの Settings → Pages → Build and deployment → Source を" \
            "「GitHub Actions」にしてから、このワークフローを再実行してください。"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
