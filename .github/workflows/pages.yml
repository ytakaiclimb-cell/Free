name: Publish web

on:
  push:
    branches:
      - '**'
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One site, so the newest push wins rather than queueing behind an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: setup
        uses: actions/configure-pages@v5
        with:
          # Enables Pages when the token is allowed to. Creating the site for
          # the very first time needs admin rights, which this token does not
          # have, so that one step is done by hand — see below.
          enablement: true

      - name: How to switch Pages on
        if: failure() && steps.setup.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages がまだ有効ではありません。" \
            "リポジトリの Settings → Pages → Build and deployment → Source を" \
            "「GitHub Actions」にしてから、このワークフローを再実行してください。"

      - name: Stamp the build
        run: |
          # A fresh query string per deploy, so a browser can never pair a new
          # page with a stale script. The same stamp is shown in the header.
          STAMP="${GITHUB_RUN_NUMBER}.$(echo "$GITHUB_SHA" | cut -c1-7)"
          sed -i "s/__BUILD__/${STAMP}/g" web/index.html web/install/index.html web/app.js
          grep -o "v=[0-9][^\"]*" web/index.html | head -2

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
