name: Build APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" < /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain --stacktrace assembleDebug < /dev/null

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/mpc.apk
          ls -lh out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpc-apk
          path: out/mpc.apk
          if-no-files-found: error

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<EOF
          M.P.C ランチャーの最新ビルドです。

          - バージョン: 0.1.${{ github.run_number }} (versionCode ${{ github.run_number }})
          - ブランチ: \`${{ github.ref_name }}\`
          - コミット: ${{ github.sha }}

          ## スマホへの入れかた

          下の \`mpc.apk\` をタップしてダウンロードし、開いてインストールしてください。
          初回は「提供元不明のアプリ」の許可を求められます。

          直リンク:
          https://github.com/${{ github.repository }}/releases/latest/download/mpc.apk
          EOF
          )
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest out/mpc.apk --clobber
            gh release edit latest --title "M.P.C (最新ビルド)" --notes "$NOTES"
          else
            gh release create latest out/mpc.apk \
              --target "$GITHUB_SHA" \
              --title "M.P.C (最新ビルド)" \
              --notes "$NOTES"
          fi
