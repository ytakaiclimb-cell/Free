name: Build APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          # The action's default package list still asks for the retired
          # "tools" package, which now fails the whole step. Everything this
          # build needs is installed by hand below.
          packages: ''

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" < /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain --stacktrace assembleDebug < /dev/null

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/mpc.apk
          cp pop/build/outputs/apk/debug/pop-debug.apk out/pop.apk
          ls -lh out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
          if-no-files-found: error

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<EOF
          このリポジトリの最新ビルドです。

          - バージョン: 0.1.${{ github.run_number }} (versionCode ${{ github.run_number }})
          - ブランチ: \`${{ github.ref_name }}\`
          - コミット: ${{ github.sha }}

          ## アプリ

          | ファイル | 中身 |
          |---|---|
          | \`pop.apk\` | **POP INSTA** — A4 の POP をインスタの投稿サイズに変換 |
          | \`mpc.apk\` | **M.P.C** — パッドとフェーダーのホームアプリ |

          ## スマホへの入れかた

          下のファイルをタップしてダウンロードし、開いてインストールしてください。
          初回は「提供元不明のアプリ」の許可を求められます。

          直リンク:
          https://github.com/${{ github.repository }}/releases/latest/download/pop.apk
          https://github.com/${{ github.repository }}/releases/latest/download/mpc.apk
          EOF
          )
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest out/mpc.apk out/pop.apk --clobber
            gh release edit latest --title "最新ビルド (POP INSTA / M.P.C)" --notes "$NOTES"
          else
            gh release create latest out/mpc.apk out/pop.apk \
              --target "$GITHUB_SHA" \
              --title "最新ビルド (POP INSTA / M.P.C)" \
              --notes "$NOTES"
          fi
