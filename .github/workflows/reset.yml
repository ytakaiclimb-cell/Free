name: Reset repository

# One-shot cleanup: removes the published release and its tag so the
# repository can go back to being empty.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the "latest" release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --cleanup-tag --yes
            echo "deleted release and tag: latest"
          else
            echo "no release named latest"
          fi
          echo "--- remaining releases ---"
          gh release list || true
